name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Check new stable Typst releases even when the package has not changed.
    - cron: "23 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Typst ${{ matrix.typst-version }}
    strategy:
      fail-fast: false
      matrix:
        typst-version: ["0.13.0", "latest"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ matrix.typst-version }}

      - name: Check packaged template compatibility without warnings
        run: ./scripts/check

      - name: Archive packaged template and diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-${{ matrix.typst-version }}
          path: tests/out/
          retention-days: 5

  visual:
    name: Visual regressions (Tytanic 0.4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tytanic embeds Typst 0.15.1. Keep it fixed so compiler changes do not
      # silently alter the renderer used to compare committed references.
      - name: Setup Tytanic
        uses: typst-community/setup-tytanic@v1.1.0
        with:
          tytanic-version: "0.4.1"

      - name: Compare visual references
        run: tt run --warnings promote --no-fail-fast

      - name: Archive visual test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-tytanic-0.4.1
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5
