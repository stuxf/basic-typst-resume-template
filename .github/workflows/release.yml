name: Validate and package release
on:
  push:
    tags: [ v* ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine and check package metadata
        run: |
          . scripts/setup
          echo "PKG_NAME=${PKG_PREFIX}" >> "${GITHUB_ENV}"
          echo "PKG_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "package version ${VERSION} does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Setup typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "latest"

      - name: Setup Tytanic
        uses: typst-community/setup-tytanic@v1.1.0
        with:
          tytanic-version: "0.4.1"

      - name: Check packaged template compatibility without warnings
        run: ./scripts/check

      - name: Compare visual references
        run: tt run --warnings promote --no-fail-fast

      - name: Build package
        run: ./scripts/package out

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}-${{ env.PKG_VERSION }}
          path: out/${{ env.PKG_NAME }}/${{ env.PKG_VERSION }}/
          if-no-files-found: error
          include-hidden-files: true
